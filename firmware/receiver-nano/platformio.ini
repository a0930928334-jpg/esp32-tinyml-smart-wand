; Receiver firmware for an Arduino Nano (ATmega328P).
; Use board = nanoatmega328new if your Nano has the newer bootloader.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags =
    -I ../common
lib_deps =
    z3t0/IRremote@^4.4.1
    arduino-libraries/Servo@^1.2.2
