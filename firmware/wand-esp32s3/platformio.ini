; Smart wand firmware for an ESP32-S3 DevKit.
;
; Before building, export the trained model from Edge Impulse as an
; "Arduino library" and unzip it into lib/SmartWand2_inferencing/.
; The model is not committed to this repository.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    crankyoldgit/IRremoteESP8266@^2.8.6
