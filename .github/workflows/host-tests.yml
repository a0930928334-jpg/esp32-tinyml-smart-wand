name: host-tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests (${{ matrix.compiler }})
        run: make -C tests CXX=${{ matrix.compiler }}
      - name: Re-run with AddressSanitizer and UBSan
        run: |
          make -C tests clean
          make -C tests CXX=${{ matrix.compiler }} \
            CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined"
